server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2048m;
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    # The backend upstream must resolve lazily: with a static proxy_pass,
    # nginx resolves "backend" at startup and refuses to start when no such
    # host exists (e.g. Coolify two-app deploys, where the API is a separate
    # app). A variable forces request-time resolution, so nginx starts and
    # serves the static app; /api calls go direct to VITE_API_URL there.
    # In compose the "backend" host resolves and the proxy works as before.
    location ~ ^/(api|videos|thumbnails|mcp|gallery|video)(/|$) {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
